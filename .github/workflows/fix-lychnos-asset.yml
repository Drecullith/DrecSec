name: Fix Lychnos asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-lychnos-asset.yml'
      - 'public/lychnos-mascot-fixed.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-lychnos-asset
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true

      - name: Decode staged mascot
        shell: bash
        run: |
          set -euo pipefail
          test -f public/lychnos-mascot-fixed.b64
          base64 --decode public/lychnos-mascot-fixed.b64 > public/lychnos-mascot.webp
          rm public/lychnos-mascot-fixed.b64
          file public/lychnos-mascot.webp | grep -q 'Web/P image'
          test "$(wc -c < public/lychnos-mascot.webp)" -gt 15000

      - name: Commit corrected binary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/lychnos-mascot.webp public/lychnos-mascot-fixed.b64
          git commit -m 'fix: store Lychnos mascot as binary WebP'
          git push
